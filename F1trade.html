<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Throckmorton F1 Prediction Engine</title>
    <!-- Updated to point to your new CSS file name -->
    <link rel="stylesheet" href="{{ url_for('static', filename='f1_trade.css') }}">
</head>
<body>
    <header>
        <h1>Throckmorton Algorithmic Trading</h1>
        <div class="controls">
            <label for="event-selector">Select Kalshi Market:</label>
            <select id="event-selector" onchange="loadMarketData()">
                <option value="gp_win">Belgian GP - Race Win</option>
                <option value="gp_quali">Belgian GP - Qualifying</option>
                <option value="sprint_win">Sprint Win</option>
                <option value="sprint_pole">Sprint Qualifying</option>
            </select>
        </div>
    </header>
    
    <main>
        <table>
            <thead>
                <tr>
                    <th>Driver</th>
                    <th>Predicted YES (Fair Value)</th>
                    <th>Predicted NO (Fair Value)</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="market-body">
                <!-- Data populated dynamically by JS -->
            </tbody>
        </table>
    </main>

    <script>
        function loadMarketData() {
            const eventType = document.getElementById('event-selector').value;
            const tbody = document.getElementById('market-body');
            tbody.innerHTML = '<tr><td colspan="4">Calculating probabilities...</td></tr>';

            fetch(`/api/predict/${eventType}`)
                .then(response => response.json())
                .then(data => {
                    tbody.innerHTML = '';
                    data.forEach(market => {
                        const row = `<tr>
                            <td><strong>${market.driver}</strong></td>
                            <td class="price-yes">$${market.yes_price}</td>
                            <td>$${market.no_price}</td>
                            <td><button class="trade-btn">Queue Order</button></td>
                        </tr>`;
                        tbody.innerHTML += row;
                    });
                });
        }

        window.onload = loadMarketData;
    </script>
</body>
</html>
